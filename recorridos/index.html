<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa de ejemplo · Recorrido virtual</title>
<style id="app-css">
:root{--bg:#0f1012;--panel:#17181b;--line:#2a2c31;--text:#ecebe7;--mute:#9a9893;--accent:#e8b65a;--accent-ink:#1b1406;--danger:#e2705f;--wa:#25d366;--glass:rgba(18,19,22,.62)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#111214}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#stage.placing #c{cursor:crosshair}
.glass{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#hotspots{position:absolute;inset:0;pointer-events:none}
.hs{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.hs .ring{position:relative;width:52px;height:52px;border-radius:50%;background:rgba(15,16,18,.55);border:2px solid rgba(255,255,255,.92);display:grid;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 4px 18px rgba(0,0,0,.35);transition:transform .15s}
.hs:hover .ring{transform:scale(1.08)}
.hs .ring::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(255,255,255,.6);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.hs.info .ring{width:36px;height:36px;background:rgba(255,255,255,.92);border-color:#fff}
.hs.info .ring::after{display:none}
.hs svg{width:22px;height:22px}
.hs.info svg{width:18px;height:18px}
.hs .lbl{font-size:13px;font-weight:600;background:rgba(15,16,18,.7);padding:3px 9px;border-radius:999px;white-space:nowrap}
.hs.sel .ring{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s}
#fade.on{opacity:1}
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:12px 12px 26px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none;z-index:3}
#top > *{pointer-events:auto}
#title{flex:1;font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.5);pointer-events:none}
.pill{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:550;white-space:nowrap}
.pill.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#tools{position:absolute;right:12px;top:64px;display:flex;flex-direction:column;gap:8px;z-index:3}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;padding:0}
.ib svg{width:20px;height:20px}
.ib.on{background:var(--accent);border-color:var(--accent)}
.ib.on svg{stroke:var(--accent-ink)}
#bl{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;gap:8px;align-items:center;max-width:calc(100% - 170px)}
#roomLabel{font-weight:650;font-size:15px;padding:7px 12px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btnPhotos{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px}
#btnPhotos svg{width:18px;height:18px}
#views{display:flex;gap:2px;padding:3px;border-radius:10px;border:1px solid rgba(255,255,255,.22)}
#views button{min-width:30px;height:28px;border:0;background:none;border-radius:7px;font-weight:650;font-size:14px;padding:0 6px}
#views button.cur{background:var(--accent);color:var(--accent-ink)}
.viewStrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.viewStrip .rt,.viewStrip .add{width:92px}
.viewStrip .add{min-height:64px}
#hint{position:absolute;left:50%;top:44%;transform:translateX(-50%);z-index:2;font-size:13px;color:#eee;background:rgba(15,16,18,.6);padding:6px 12px;border-radius:999px;transition:opacity .5s;white-space:nowrap;pointer-events:none}
#hint.gone{opacity:0}
#placeBanner{position:absolute;left:50%;top:66px;transform:translateX(-50%);z-index:6;background:var(--accent);color:var(--accent-ink);font-weight:650;padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#roomsMenu{position:absolute;right:62px;top:64px;z-index:7;background:rgba(23,24,27,.97);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:200px;max-height:70%;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#roomsMenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:10px}
#roomsMenu button:hover,#roomsMenu button.cur{background:rgba(255,255,255,.08)}
#roomsMenu img{width:56px;height:28px;object-fit:cover;border-radius:5px}
/* minimap */
#minimap{position:absolute;right:12px;bottom:12px;z-index:4;width:136px;border-radius:12px;padding:5px;border:1px solid rgba(255,255,255,.2);transition:width .25s}
#minimap.big{width:min(calc(100% - 24px),480px)}
#app.editing #minimap:not(.big){width:100px}
.mm-in{position:relative;width:100%;border-radius:8px;overflow:hidden;background:#f3efe7;cursor:pointer}
.mm-in.grid{background:#20232a;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:16px 16px}
.mm-in img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.mm-dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid #3b3a37;padding:0;z-index:2}
.mm-dot.cur{background:var(--accent);border-color:#5a3d06;width:16px;height:16px;margin:-8px 0 0 -8px}
#minimap.big .mm-dot{width:20px;height:20px;margin:-10px 0 0 -10px}
.mm-name{position:absolute;transform:translate(-50%,10px);font-size:11px;font-weight:700;color:#2b2a27;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:2;display:none}
#minimap.big .mm-name{display:block}
.mm-cone{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;pointer-events:none;z-index:1}
#minimap.big .mm-cone{width:150px;height:150px;margin:-75px 0 0 -75px}
.mm-x{position:absolute;right:8px;top:8px;z-index:3;width:30px;height:30px;border-radius:50%;border:0;background:rgba(20,21,24,.75);display:none}
#minimap.big .mm-x{display:grid;place-items:center}
#minimap.placing .mm-in{cursor:crosshair;outline:3px solid var(--accent)}
/* cards */
#infoCard{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:8;width:min(calc(100% - 24px),360px);background:rgba(23,24,27,.97);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#infoCard h4{margin:0 34px 6px 0;font-size:16px}
#infoCard p{margin:0;color:#cfcdc8;white-space:pre-wrap}
.cardx{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:0;background:#26282d;font-size:16px}
#gallery{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.94);display:flex;flex-direction:column}
#gallery .gtop{display:flex;align-items:center;gap:10px;padding:12px 14px}
#gallery .gtop span{flex:1;color:var(--mute);font-size:14px}
#gImgWrap{flex:1;min-height:0;display:grid;place-items:center;position:relative;touch-action:pan-y}
#gImg{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
#gCap{padding:10px 16px 20px;text-align:center;min-height:52px}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);font-size:22px}
#gPrev{left:10px}#gNext{right:10px}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:1}
#empty h2{margin:0 0 6px;font-size:20px}
#empty p{margin:0 0 16px;color:var(--mute)}
/* property sheet */
.prop-price{font-size:26px;font-weight:750;margin:2px 0}
.prop-loc{color:var(--mute);margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#24262b;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px}
.prop-desc{white-space:pre-wrap;color:#d6d4cf;margin:0 0 14px}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);color:#05230f;font-weight:700;text-decoration:none;border-radius:12px;padding:12px}
.wa svg{width:20px;height:20px}
/* editor */
#editor{flex:0 0 auto;max-height:54dvh;overflow:auto;background:var(--panel);border-top:1px solid var(--line);padding:12px 14px 18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.field{background:#0f1012;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea.field{resize:vertical;min-height:64px}
.btn{background:#24262b;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
#dirty{font-size:12px;color:var(--accent);white-space:nowrap}
#roomStrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.rt{flex:0 0 auto;width:116px;background:#0f1012;border:2px solid transparent;border-radius:10px;padding:0;overflow:hidden;text-align:left}
.rt.cur{border-color:var(--accent)}
.rt img{display:block;width:100%;height:46px;object-fit:cover}
.rt span{display:block;padding:4px 7px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .star{color:var(--accent)}
.add{flex:0 0 auto;width:116px;min-height:70px;border:2px dashed #3a3c42;border-radius:10px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--mute);cursor:pointer;padding:6px}
.add input,.fileBtn input{display:none}
.fileBtn{cursor:pointer;display:inline-block}
.lab{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.sec{display:flex;flex-direction:column;gap:8px}
input[type=range]{width:100%;accent-color:var(--accent)}
.hsrow{display:flex;align-items:center;gap:8px;background:#0f1012;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.hsrow.infoRow{flex-wrap:wrap}
.hsrow select{flex:1;background:#17181b;border:1px solid var(--line);border-radius:8px;padding:6px;min-width:0}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:#2a2c31;color:#cfcdc8;white-space:nowrap}
.tag.i{background:#e9e6df;color:#26241f}
.x{background:none;border:0;color:var(--mute);font-size:18px;padding:2px 8px}
.note{font-size:12.5px;color:var(--mute)}
.phList{display:flex;flex-direction:column;gap:6px}
.phRow{display:flex;gap:8px;align-items:center}
.phRow img{width:64px;height:44px;object-fit:cover;border-radius:6px;flex:0 0 auto}
details.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#141518}
details.box summary{cursor:pointer;font-weight:650;list-style:none}
details.box summary::before{content:"▸ ";color:var(--mute)}
details.box[open] summary::before{content:"▾ "}
details.box .sec{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:#25272c;border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
#modal .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;max-height:85dvh;overflow:auto;padding:18px 18px 14px}
#modal h3{margin:0 0 10px}
#modal ol{padding-left:20px;margin:0 0 12px}
#modal li{margin-bottom:7px}
[hidden]{display:none!important}
@media (min-width:900px){
  #app{flex-direction:row}
  #editor{max-height:none;width:380px;border-top:0;border-left:1px solid var(--line);order:2}
  #minimap{width:190px}
}
</style>
<script type="importmap" id="app-importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<template id="app-shell">
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hotspots"></div>
    <div id="fade"></div>
    <div id="empty" hidden>
      <div>
        <h2>Tu recorrido virtual</h2>
        <p id="emptyMsg">Este recorrido aún no tiene fotos.</p>
        <label class="pill primary fileBtn" id="emptyAdd" hidden>Añadir panorámicas<input type="file" accept="image/*" multiple></label>
      </div>
    </div>
    <div id="top">
      <div id="title"></div>
      <button class="pill glass" id="btnDetails" hidden>Detalles</button>
      <button class="pill primary" id="btnEdit" hidden>Editar</button>
    </div>
    <div id="tools">
      <button class="ib glass" id="btnRooms" title="Habitaciones" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6.5 8 6.5M6 9.5V20h12V9.5M10 20v-5h4v5"/></svg></button>
      <button class="ib glass" id="btnAuto" title="Recorrido automático" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
      <button class="ib glass" id="btnGyro" title="Mirar moviendo el celular" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M3 9c-1.3 2-1.3 4 0 6M21 9c1.3 2 1.3 4 0 6"/></svg></button>
      <button class="ib glass" id="btnFull" title="Pantalla completa" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div id="roomsMenu" hidden></div>
    <div id="placeBanner" hidden></div>
    <div id="bl">
      <div id="roomLabel" class="glass"></div>
      <div id="views" class="glass" role="group" aria-label="Vistas de esta habitación" hidden></div>
      <button id="btnPhotos" class="glass" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M4 7.5h3.2L9 5h6l1.8 2.5H20a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="photoCount"></span></button>
    </div>
    <div id="minimap" class="glass" hidden>
      <div class="mm-in" id="mmIn"><img id="mmImg" alt="" hidden></div>
      <button class="mm-x" id="mmClose" title="Cerrar plano"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="infoCard" hidden><button class="cardx" id="infoClose" aria-label="Cerrar">✕</button><h4 id="infoTitle"></h4><p id="infoText"></p></div>
    <div id="hint">Arrastra para mirar alrededor</div>
  </div>
  <section id="editor" hidden>
    <div class="row">
      <input class="field grow" id="tourTitle" placeholder="Nombre del recorrido" maxlength="80">
      <span id="dirty" hidden>● Sin guardar</span>
    </div>
    <div class="row">
      <button class="btn primary" id="btnSave">Guardar</button>
      <button class="btn" id="btnView">Ver como visitante</button>
      <button class="btn" id="btnTips">Cómo tomar las fotos</button>
    </div>
    <div class="sec">
      <div class="lab">Habitaciones</div>
      <div id="roomStrip"></div>
    </div>
    <div id="roomPanel" class="sec" hidden>
      <input class="field" id="roomName" placeholder="Nombre de la habitación" maxlength="40">
      <div class="lab" style="margin-top:4px">Panorámicas de esta habitación</div>
      <div class="viewStrip" id="viewStrip"></div>
      <div class="note" id="viewNote"></div>
      <div class="row" id="viewRow" hidden><span class="note grow" id="viewTitle"></span><button class="btn danger" id="btnDelView">Quitar esta panorámica</button></div>
      <div>
        <div class="row"><span class="lab grow">Ángulo de la panorámica</span><b id="hfovVal"></b></div>
        <input type="range" id="hfov" min="30" max="360" step="5">
        <div class="note">Si diste la vuelta completa, ponlo en 360°. Si la foto se ve estirada o aplastada, ajústalo hasta que las paredes se vean rectas.</div>
      </div>
      <div class="row">
        <button class="btn" id="btnStartView">Usar esta vista al entrar</button>
        <button class="btn" id="btnStartRoom">Empezar aquí</button>
      </div>
      <div class="lab" style="margin-top:4px">Puntos de paso y etiquetas</div>
      <div id="hsList" style="display:flex;flex-direction:column;gap:6px"></div>
      <div class="row">
        <button class="btn" id="btnPlace">+ Punto de paso</button>
        <button class="btn" id="btnPlaceInfo">+ Etiqueta</button>
      </div>
      <div class="lab" style="margin-top:4px">Fotos de detalle</div>
      <div class="phList" id="phList"></div>
      <div class="row"><label class="btn fileBtn">+ Añadir fotos normales<input type="file" accept="image/*" multiple id="phIn"></label></div>
      <div class="lab" style="margin-top:4px">En el plano</div>
      <div class="row">
        <button class="btn" id="btnPlanPlace">Ubicar en el plano</button>
        <button class="btn" id="btnPlanRemove" hidden>Quitar del plano</button>
      </div>
      <div id="planRotBox" hidden>
        <div class="row"><span class="lab grow">Dirección en el plano</span><b id="planRotVal"></b></div>
        <input type="range" id="planRot" min="0" max="355" step="5">
        <div class="note">Gira hasta que el cono del plano apunte hacia donde miras en la foto.</div>
      </div>
      <div class="row" style="margin-top:6px"><span class="grow"></span><button class="btn danger" id="btnDelRoom">Eliminar habitación</button></div>
    </div>
    <details class="box" id="planBox">
      <summary>Plano de la casa</summary>
      <div class="sec">
        <div class="note">Sube una foto o dibujo del plano (opcional). Luego, en cada habitación, toca «Ubicar en el plano». Sin imagen, se usa una cuadrícula.</div>
        <div class="row">
          <label class="btn fileBtn"><span id="planUpLabel">Subir plano</span><input type="file" accept="image/*" id="planIn"></label>
          <button class="btn danger" id="btnPlanDel" hidden>Quitar imagen</button>
        </div>
      </div>
    </details>
    <details class="box" id="propBox">
      <summary>Ficha de la propiedad</summary>
      <div class="sec">
        <div class="note">Se muestra en el botón «Detalles». Deja vacío lo que no quieras mostrar.</div>
        <input class="field" data-prop="price" placeholder="Precio (ej. $120.000 o ₡65.000.000)">
        <input class="field" data-prop="location" placeholder="Ubicación">
        <div class="grid2">
          <input class="field" data-prop="area" placeholder="Área (ej. 120 m²)">
          <input class="field" data-prop="lot" placeholder="Lote (ej. 200 m²)">
          <input class="field" data-prop="bedrooms" placeholder="Habitaciones">
          <input class="field" data-prop="bathrooms" placeholder="Baños">
          <input class="field" data-prop="parking" placeholder="Parqueos">
          <input class="field" data-prop="type" placeholder="Venta / Alquiler">
        </div>
        <textarea class="field" data-prop="description" placeholder="Descripción"></textarea>
        <input class="field" data-prop="contact" placeholder="Nombre de contacto">
        <input class="field" data-prop="whatsapp" placeholder="WhatsApp con código de país (ej. 506 8888 8888)" inputmode="tel">
      </div>
    </details>
    <div class="row" style="border-top:1px solid var(--line);padding-top:10px">
      <button class="btn" id="btnDemo" hidden>Quitar ejemplo</button>
      <button class="btn" id="btnDownload" hidden>Descargar HTML</button>
      <span class="note grow" id="saveNote"></span>
    </div>
  </section>

<script type="module" id="app-js">

for (const r of state.rooms) {

  while (m && m.of && m !== r && n++ < 50) m = getRoom(m.of);

  return g.length > 1 ? m.name + ' · ' + (g.indexOf(r) + 1) : m.name;
}

const caps = { artifact: null, assets: null, downloads: null };
let canEdit = false, localOnly = false;

const canvas = $('#c');

function baseFov() { return camera.aspect < 1 ? lim.maxFov : Math.min(70, lim.maxFov); }

  const r = $('#stage').getBoundingClientRect();
  renderer.setSize(Math.max(1, r.width), Math.max(1, r.height), false);
  camera.aspect = Math.max(1, r.width) / Math.max(1, r.height);
  camera.updateProjectionMatrix();

function clampView() {

  const vf = rad(view.fov) / 2;

  view.pitch = clamp(view.pitch, -pmax, pmax);

    first = first || room; markDirty();
  });
  if (n) { toast('Fotos añadidas. Ponles nombre y conecta las puertas.', 3200); await showRoom(first.id); }
  updateChrome(); renderEditor();
}
async function onViewFiles(e) {
  const files = [...(e.target.files || [])]; e.target.value = '';
  const cur = getRoom(curId); if (!cur) return;
  const m = mainOf(cur);
  let first = null;
  const n = await withFiles(files, 'pano', (p, st) => {
    const v = { id: uid(), of: m.id, name: m.name, src: st.src, assetId: st.assetId, w: p.w, h: p.h, hfov: estimateHfov(p.w / p.h), startYaw: 0, startPitch: 0, hotspots: [], photos: [] };
    // Se inserta junto a las otras vistas para que el recorrido automático las siga en orden.
    const g = viewsOf(m), at = state.rooms.indexOf(g[g.length - 1]) + 1;
    state.rooms.splice(at, 0, v);
    first = first || v; markDirty();
  });
  if (n) { toast(n === 1 ? 'Panorámica añadida a «' + m.name + '»' : n + ' panorámicas añadidas a «' + m.name + '»', 3200); await showRoom(first.id); }
  updateChrome(); renderEditor();
}
$('#emptyAdd input').addEventListener('change', async e => { if (mode !== 'edit') setMode('edit'); await onFiles(e); });
$('#phIn').addEventListener('change', async e => {
  const files = [...(e.target.files || [])]; e.target.value = '';
  const room = mainOf(getRoom(curId)); if (!room) return;
  const n = await withFiles(files, 'photo', (p, st) => { room.photos.push({ id: uid(), src: st.src, assetId: st.assetId, caption: '' }); markDirty(); });
  if (n) toast(n === 1 ? 'Foto añadida' : n + ' fotos añadidas');
  updateChrome(); renderEditor();
});
$('#planIn').addEventListener('change', async e => {
  const files = [...(e.target.files || [])].slice(0, 1); e.target.value = '';
  const n = await withFiles(files, 'plan', (p, st) => { state.plan = { src: st.src, assetId: st.assetId, w: p.w, h: p.h }; markDirty(); });
  if (n) { toast('Plano listo. Ahora ubica cada habitación.', 3200); renderMinimap(); mm.classList.add('big'); }
  renderEditor();
});

/* ---------- save / export ---------- */
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function buildDoc(data) {
  const css = document.getElementById('app-css').textContent;
  const imp = document.getElementById('app-importmap').textContent;
  const js = document.getElementById('app-js').textContent;
  const shell = document.getElementById('app-shell').innerHTML;
  const json = JSON.stringify(data).replace(/</g, '\\u003c');
  return '<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>' + (data.readonly ? esc(data.title || 'Recorrido virtual') : 'Recorrido virtual') + '<\/title>\n'
    + '<style id="app-css">' + css + '<\/style>\n'
    + '<script type="importmap" id="app-importmap">' + imp + '<\/script>\n<\/head>\n<body>\n'
    + '<template id="app-shell">' + shell + '<\/template>\n'
    + '<script id="tour-data" type="application/json">' + json + '<\/script>\n'
    + '<script type="module" id="app-js">' + js + '<\/script>\n<\/body>\n<\/html>\n';
}
function cleanState() {
  const s = JSON.parse(JSON.stringify({ title: state.title, start: state.start || state.rooms[0]?.id || null, rooms: state.rooms, plan: state.plan, property: state.property }));
  for (const r of s.rooms) r.hotspots = r.hotspots.map(h => h.type === 'info' ? h : { id: h.id, yaw: h.yaw, pitch: h.pitch, to: h.to });
  return s;
}
$('#btnSave').addEventListener('click', async () => {
  if (localOnly || !caps.artifact) { toast('Guardar no está disponible en esta vista.', 3500); return; }
  const btn = $('#btnSave'); btn.disabled = true; btn.textContent = 'Guardando…';
  try { sessionStorage.setItem('tour-ui', JSON.stringify({ mode: 'edit', room: curId, yaw: view.yaw, pitch: view.pitch })); } catch (e) {}
  try {
    const doc = buildDoc(cleanState());
    dirty = false;
    await caps.artifact.publish(doc);
    toast('Guardado');
  } catch (err) {
    dirty = true;
    const c = err && err.code;
    if (c === 'conflict') toast('Alguien guardó otra versión; recargando…', 4000);
    else if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'not_declared'].includes(c)) toast('Esta vista es de solo lectura: no puedes guardar cambios aquí.', 4000);
    else if (c === 'too_large') toast('El recorrido es demasiado grande para guardarlo. Quita alguna foto.', 4500);
    else toast('No se pudo guardar (' + (c || 'error') + '). Intenta de nuevo.', 4000);
  } finally { btn.disabled = false; btn.textContent = 'Guardar'; }
});
async function inlineSrc(src) { if (!src || src.startsWith('data:')) return src; const b = await (await fetch(src)).blob(); return blobToDataURL(b); }
$('#btnDownload').addEventListener('click', async () => {
  if (!caps.downloads && !localOnly) return;
  const btn = $('#btnDownload'); btn.disabled = true; btn.textContent = 'Preparando…';
  try {
    const data = cleanState(); data.readonly = true;
    for (const r of data.rooms) {
      // Las marcas "demo" se conservan para que «Quitar ejemplo» siga funcionando al editar con #editar.
      delete r.assetId; r.src = await inlineSrc(r.src);
      for (const p of r.photos) { delete p.assetId; p.src = await inlineSrc(p.src); }
    }
    if (data.plan) { delete data.plan.assetId; data.plan.src = await inlineSrc(data.plan.src); }
    const name = (state.title || 'recorrido').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'recorrido';
    const blob = new Blob([buildDoc(data)], { type: 'text/html' });
    if (caps.downloads) await caps.downloads.save({ filename: name + '.html', data: blob });
    else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = name + '.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
    dirty = false; $('#dirty').hidden = true;
    toast('Archivo listo. Puedes abrirlo en cualquier navegador o subirlo a tu web.', 4000);
  } catch (err) {
    const c = err && err.code;
    if (c !== 'declined') toast('No se pudo descargar (' + (c || 'error') + ')', 4000);
  } finally { btn.disabled = false; btn.textContent = 'Descargar HTML'; }
});
window.addEventListener('beforeunload', e => { if (dirty && mode === 'edit') { e.preventDefault(); e.returnValue = ''; } });

/* ---------- loop ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  stepAnim(now); stepXfade(now);
  if (gyro.on && gyro.got && !anim) { view.yaw = gyro.yaw + gyro.offset; view.pitch = gyro.pitch; clampView(); }
  stepAuto(dt);
  camera.fov = view.fov; camera.updateProjectionMatrix();
  camera.rotation.set(view.pitch, -view.yaw, 0);
  camera.updateMatrixWorld();
  renderer.render(scene, camera);
  positionHotspots(); updateCone();
  requestAnimationFrame(loop);
}

/* ---------- start ---------- */
let ui = null;
try { ui = JSON.parse(sessionStorage.getItem('tour-ui') || 'null'); sessionStorage.removeItem('tour-ui'); } catch (e) {}
$('#btnGyro').hidden = !(typeof DeviceOrientationEvent !== 'undefined' && window.matchMedia && matchMedia('(pointer:coarse)').matches);
resize();
requestAnimationFrame(loop);
updateChrome(); renderMinimap();
const startId = (ui && getRoom(ui.room) && ui.room) || (getRoom(state.start) && state.start) || state.rooms[0]?.id;
if (startId) showRoom(startId, ui && ui.room === startId ? { yaw: ui.yaw, pitch: ui.pitch } : {});

(async () => {
  let cl = window.claude;
  for (let i = 0; i < 15 && !(cl && typeof cl.use === 'function'); i++) { await sleep(100); cl = window.claude; }
  if (!cl || typeof cl.use !== 'function') {
    localOnly = true; canEdit = !state.readonly || location.hash === '#editar';
  } else {
    const [a, s, d] = await Promise.all(['artifact', 'assets', 'downloads'].map(n => cl.use(n).catch(() => null)));
    caps.artifact = a; caps.assets = s; caps.downloads = d;
    canEdit = !state.readonly && !!a && !!s;
  }
  updateChrome();
  if (canEdit && ui && ui.mode === 'edit') setMode('edit');
  else renderEditor();
})();
</script>
</body>
</html>
